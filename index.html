<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo Tường Kỷ Niệm Lớp Yêu Thương - Sách Ảnh Nghệ Thuật</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #e8f5e9 50%, #e3f2fd 100%);
            color: #333; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            padding: 20px; overflow-x: hidden;
        }
        header {
            text-align: center; padding: 25px 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            margin-bottom: 20px; border: 3px dashed #ffb74d; width: 100%; max-width: 900px;
        }
        header h1 { font-size: 2rem; color: #e91e63; margin-bottom: 5px; text-shadow: 2px 2px 0px #ffe0b2; }
        header p { font-size: 1rem; color: #555; }

        /* Giao diện Lật Trang Sách (Album View) */
        .book-container {
            position: relative;
            width: 100%; max-width: 800px; height: 550px;
            display: flex; justify-content: center; align-items: center;
            perspective: 1500px;
            margin-bottom: 20px;
        }

        .page {
            position: absolute;
            width: 100%; height: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            padding: 20px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border: 8px solid #fff;
            outline: 2px solid #ffcc80;
            transition: transform 0.6s cubic-bezier(0.645, 0.045, 0.355, 1), opacity 0.6s ease;
            backface-visibility: hidden;
        }

        .page img {
            max-width: 100%; max-height: 420px;
            object-fit: contain; border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            cursor: pointer;
        }

        .page-caption {
            margin-top: 15px; font-weight: 700; color: #d81b60; font-size: 1.1rem;
            text-align: center;
        }

        /* Các góc độ ngẫu nhiên cho trang ảnh tạo cảm giác dán thủ công */
        .page.tilt-left { transform: rotate(-3deg); }
        .page.tilt-right { transform: rotate(3deg); }
        .page.tilt-straight { transform: rotate(0deg); }

        /* Nút điều hướng lật trang */
        .nav-buttons {
            display: flex; gap: 20px; align-items: center; margin-bottom: 20px;
        }
        button.nav-btn {
            background-color: #e91e63; color: white; border: none;
            padding: 12px 25px; border-radius: 30px; font-weight: 700;
            font-size: 1rem; cursor: pointer; box-shadow: 0 5px 15px rgba(233,30,99,0.3);
            transition: background 0.2s, transform 0.2s;
            font-family: 'Quicksand', sans-serif;
        }
        button.nav-btn:hover { background-color: #c2185b; transform: scale(1.05); }
        button.nav-btn:active { transform: scale(0.95); }

        .page-indicator {
            font-weight: 700; color: #455a64; font-size: 1.1rem;
            background: rgba(255,255,255,0.8); padding: 8px 15px; border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
        }

        footer { text-align: center; color: #78909c; font-weight: 600; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <h1>🌟 SÁCH ẢNH BÁO TƯỜNG KỶ NIỆM 🌟</h1>
        <p>Chạm vào ảnh hoặc dùng nút bấm để lật qua các khoảnh khắc tuyệt vời của lớp mình!</p>
    </header>

    <div class="book-container" id="bookContainer" onclick="nextPage()">
        <!-- Các trang ảnh sẽ được tạo tự động bằng JavaScript -->
    </div>

    <div class="nav-buttons">
        <button class="nav-btn" onclick="prevPage(event)">⬅️ Trang trước</button>
        <div class="page-indicator" id="pageIndicator">1 / 22</div>
        <button class="nav-btn" onclick="nextPage(event)">Trang sau ➡️</button>
    </div>

    <footer>
        <p>Trang web thực hiện bởi Cô và Trò lớp chúng mình ❤️</p>
    </footer>

    <script>
        const totalImages = 22;
        let currentPage = 0;
        const bookContainer = document.getElementById('bookContainer');
        const pageIndicator = document.getElementById('pageIndicator');

        // Mảng các góc nghiêng ngẫu nhiên cho sinh động
        const tilts = ['tilt-left', 'tilt-right', 'tilt-straight'];

        // Khởi tạo các trang ảnh
        for (let i = 1; i <= totalImages; i++) {
            const page = document.createElement('div');
            // Chọn ngẫu nhiên góc nghiêng cho mỗi trang
            const randomTilt = tilts[Math.floor(Math.random() * tilts.length)];
            page.className = `page ${randomTilt}`;
            
            // Ẩn các trang sau, chỉ hiện trang đầu tiên
            if (i > 1) {
                page.style.display = 'none';
                page.style.opacity = '0';
            }

            const imgPath = `images/${i}.jpg`;
            const fallbackPath = `images/${i}.png`;

            page.innerHTML = `
                <img src="${imgPath}" alt="Khoảnh khắc ${i}" 
                     onerror="if(this.src.endsWith('.jpg')) { this.src='images/${i}.png'; } else { this.src='https://via.placeholder.com/600x400?text=Anh+${i}+chua+co'; }">
                <div class="page-caption">Khoảnh khắc dễ thương số #${i}</div>
            `;
            
            bookContainer.appendChild(page);
        }

        const pages = bookContainer.getElementsByClassName('page');

        function updateBook() {
            for (let i = 0; i < pages.length; i++) {
                if (i === currentPage) {
                    pages[i].style.display = 'flex';
                    setTimeout(() => { pages[i].style.opacity = '1'; }, 50);
                } else {
                    pages[i].style.opacity = '0';
                    setTimeout(() => { 
                        if(i !== currentPage) pages[i].style.display = 'none'; 
                    }, 400);
                }
            }
            pageIndicator.innerText = `${currentPage + 1} / ${totalImages}`;
        }

        function nextPage(event) {
            if(event) event.stopPropagation();
            currentPage = (currentPage + 1) % totalImages;
            updateBook();
        }

        function prevPage(event) {
            if(event) event.stopPropagation();
            currentPage = (currentPage - 1 + totalImages) % totalImages;
            updateBook();
        }
    </script>
</body>
</html>
