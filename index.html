<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo Tường Kỷ Niệm Lớp Yêu Thương - Sách Ảnh Nghệ Thuật</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #e8f5e9 50%, #e3f2fd 100%);
            color: #333; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            padding: 20px; overflow-x: hidden;
        }
        header {
            text-align: center; padding: 25px 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            margin-bottom: 20px; border: 3px dashed #ffb74d; width: 100%; max-width: 900px;
        }
        header h1 { font-size: 2rem; color: #e91e63; margin-bottom: 5px; text-shadow: 2px 2px 0px #ffe0b2; }
        header p { font-size: 1rem; color: #555; }

        /* Giao diện Lật Trang Sách (Album View) */
        .book-container {
            position: relative;
            width: 100%; max-width: 800px; height: 550px;
            display: flex; justify-content: center; align-items: center;
            perspective: 1500px;
            margin-bottom: 20px;
        }

        .page {
            position: absolute;
            width: 100%; height: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            padding: 20px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border: 8px solid #fff;
            outline: 2px solid #ffcc80;
            transition: transform 0.6s cubic-bezier(0.645, 0.045, 0.355, 1), opacity 0.6s ease;
            backface-visibility: hidden;
        }

        .page img {
            max-width: 100%; max-height: 420px;
            object-fit: contain; border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            cursor: pointer;
        }
